name: Backend CD - Deploy (fixed)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    name: CD - Backend Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment variables
        id: vars
        run: |
          # Choose environment based on the ref
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "db_name=${{ secrets.DB_NAME }}" >> $GITHUB_OUTPUT
            echo "allow_test_emails=false" >> $GITHUB_OUTPUT
            echo "server_user=${{ secrets.PROD_USER }}" >> $GITHUB_OUTPUT
            echo "server_ip=${{ secrets.PROD_IP }}" >> $GITHUB_OUTPUT

            echo "server_pass<<EOF" >> $GITHUB_OUTPUT
            echo "${{ secrets.PROD_PASS }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "remote_dir=/home/ifeanyinw/apps/backend/legal-watch-dog-be" >> $GITHUB_OUTPUT
            echo "repo_url=https://github.com/hngprojects/legal-watch-dog-be.git" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "branch=dev" >> $GITHUB_OUTPUT
            echo "db_name=${{ secrets.STAGING_DB_NAME }}" >> $GITHUB_OUTPUT
            echo "allow_test_emails=true" >> $GITHUB_OUTPUT
            echo "server_user=${{ secrets.STAGING_USER }}" >> $GITHUB_OUTPUT
            echo "server_ip=${{ secrets.STAGING_IP }}" >> $GITHUB_OUTPUT

            echo "server_pass<<EOF" >> $GITHUB_OUTPUT
            echo "${{ secrets.STAGING_PASS }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            echo "remote_dir=/home/ubuntu/apps/backend/ec2-for-tasing-" >> $GITHUB_OUTPUT
            echo "repo_url=https://github.com/Joeonome/legal-watch-dog-be.git" >> $GITHUB_OUTPUT
          fi

      - name: Generate environment file
        run: |
          ENV_NAME="${{ steps.vars.outputs.environment }}"
          cat > .env.${ENV_NAME} <<EOF
            DEBUG=False
            APP_PORT="${{ secrets.APP_PORT || '8001' }}"
            APP_NAME="LEGAL WATCH DOG"
            APP_VERSION="1.0.0"
            ENVIRONMENT="${ENV_NAME}"
            SECRET_KEY="${{ secrets.SECRET_KEY }}"
            LEGAL_WATCH_DOG_BASE_URL="${{ secrets.BASE_URL || '' }}"
            
            DB_TYPE="postgresql"
            DB_HOST="${{ secrets.DB_HOST }}"
            DB_PORT="${{ secrets.DB_PORT }}"
            DB_USER="${{ secrets.DB_USER }}"
            DB_PASS="${{ secrets.DB_PASS }}"
            DB_NAME="${{ steps.vars.outputs.db_name }}"
            DATABASE_URL="postgresql+asyncpg://${{ secrets.DB_USER }}:${{ secrets.DB_PASS }}@${{ secrets.DB_HOST }}/${{ steps.vars.outputs.db_name }}"
            
            MAIL_MAILER="smtp"
            SMTP_SERVER="${{ secrets.SMTP_SERVER }}"
            SMTP_PORT="${{ secrets.SMTP_PORT }}"
            MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}"
            MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}"
            MAIL_ENCRYPTION="${{ secrets.MAIL_ENCRYPTION }}"
            EMAIL="${{ secrets.EMAIL }}"
            MAIL_FROM_NAME="LEGAL WATCH DOG"
            
            APP_URL="https://minamoto.emerj.net"
            DEV_URL="http://localhost:3000"
            REDIS_URL="${{ secrets.REDIS_URL }}"
            REDIS_CACHE_TTL_SECONDS="${{ secrets.REDIS_CACHE_TTL_SECONDS }}"
            JWT_SECRET="${{ secrets.JWT_SECRET }}"
            JWT_ALGORITHM="${{ secrets.JWT_ALGORITHM }}"
            JWT_EXPIRY="${{ secrets.JWT_EXPIRY }}"
            ACCESS_TOKEN_EXPIRATION="${{ secrets.ACCESS_TOKEN_EXPIRATION }}"
            
            ALLOW_TEST_EMAIL_PROVIDERS="${{ steps.vars.outputs.allow_test_emails }}"
            TEST_EMAIL_PROVIDERS="gmail.com"
            ENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}"
          EOF

      - name: Setup private key file
        env:
          SSH_KEY: ${{ steps.vars.outputs.server_pass }}
        run: |
          echo "$SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

      - name: Upload .env file to server
        env:
          SERVER_USER: ${{ steps.vars.outputs.server_user }}
          SERVER_IP: ${{ steps.vars.outputs.server_ip }}
          ENV_NAME: ${{ steps.vars.outputs.environment }}
        run: |
          scp -o StrictHostKeyChecking=no -i private_key.pem \
            .env.${ENV_NAME} \
            $SERVER_USER@$SERVER_IP:/tmp/backend_env

      - name: Deploy to the server
        env:
          SSH_KEY: ${{ steps.vars.outputs.server_pass }}
          SERVER_USER: ${{ steps.vars.outputs.server_user }}
          SERVER_IP: ${{ steps.vars.outputs.server_ip }}
          REMOTE_DIR: ${{ steps.vars.outputs.remote_dir }}
          REPO_URL: ${{ steps.vars.outputs.repo_url }}
          BRANCH: ${{ steps.vars.outputs.branch }}
          ENVIRONMENT: ${{ steps.vars.outputs.environment }}
        run: |
          echo "access gained"
          echo "deploying to $ENVIRONMENT server"

          ssh -o StrictHostKeyChecking=no -i private_key.pem $SERVER_USER@$SERVER_IP << EOF
            set -euo pipefail

            # values were expanded by GH Actions into the heredoc text above
            REMOTE_DIR="${REMOTE_DIR}"
            REPO_URL="${REPO_URL}"
            BRANCH="${BRANCH}"

            # ensure parent directory exists on remote (escape $() so it runs remotely)
            if [ ! -d "${REMOTE_DIR}" ]; then
              mkdir -p \$(dirname "\$REMOTE_DIR")
              git clone "${REPO_URL}" "${REMOTE_DIR}"
            fi

            cd "${REMOTE_DIR}"

            # Ensure server matches remote branch exactly
            git fetch origin "${BRANCH}"
            git reset --hard origin/"${BRANCH}"

            # move uploaded env into place
            mv /tmp/backend_env .env || true

            # Install uv if missing and ensure PATH for this session
            if ! command -v uv &> /dev/null; then
              echo "Installing uv..."
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
              # uv installer provides an env helper
              if [ -f "$HOME/.local/bin/env" ]; then
                # source it for sh/bash compatibility
                source "$HOME/.local/bin/env" || true
              fi
            fi

            # Ensure PATH is present even if uv was already installed earlier
            export PATH="$HOME/.local/bin:$PATH"
            if [ -f "$HOME/.local/bin/env" ]; then
              source "$HOME/.local/bin/env" || true
            fi

            # run db migrations
            uv sync || true
            uv run alembic upgrade head || true

            # load env for the following commands
            set -a
            source .env
            set +a

            PM2_APP_NAME="legal-watchdog-be-${ENVIRONMENT}"

            if ! command -v pm2 &> /dev/null; then
              echo "Installing PM2..."
              npm install -g pm2
            fi

            if [ ! -f "ecosystem.config.js" ]; then
              echo "Error: ecosystem.config.js not found!"
              exit 1
            fi

            echo "Checking for existing PM2 processes..."
            pm2 describe "${PM2_APP_NAME}" > /dev/null 2>&1 && pm2 delete "${PM2_APP_NAME}" || echo "No existing process found"

            echo "Starting application with ecosystem.config.js..."
            pm2 start ecosystem.config.js --update-env || pm2 restart ecosystem.config.js --update-env

            pm2 save
            pm2 startup systemd -u \$(whoami) --hp \$(echo \$HOME) || true

            echo "${ENVIRONMENT} deployment complete on port ${APP_PORT}!"
            pm2 status
          EOF

          # cleanup private key
          rm -f private_key.pem

  notify_slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH_NAME" == "main" ]; then
            ENV_NAME="Production"
            EMOJI="🚀"
          else
            ENV_NAME="Staging"
            EMOJI="🧪"
          fi

          if [ "${DEPLOY_RESULT}" == "success" ]; then
            MAIN_STATUS="✅ Deployment Successful"
            STATUS_COLOR="good"
            DETAIL_MSG="\n✅ *${ENV_NAME} Environment:* Successfully deployed"
          else
            MAIN_STATUS="❌ Deployment Failed"
            STATUS_COLOR="danger"
            DETAIL_MSG="\n❌ *${ENV_NAME} Environment:* Failed to deploy"
          fi

          LOG_LINK="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD="{\"attachments\":[{\"color\":\"${STATUS_COLOR}\",\"blocks\":[{\"type\":\"header\",\"text\":{\"type\":\"plain_text\",\"text\":\"⚙️ Backend Deployment Update\",\"emoji\":true}},{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"*${MAIN_STATUS}*${DETAIL_MSG}\"}},{\"type\":\"divider\"},{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"Need help? Check the <${LOG_LINK}|detailed logs>.\"}}]}]}"

          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" $SLACK_WEBHOOK || true
